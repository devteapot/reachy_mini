# Sloppy config for the Reachy Mini VOICE demo (Phase 3 — full DGX Spark stack).
#
# Loaded in isolation from your global ~/.sloppy config by running sloppy with
# HOME pointed at this `demo/` directory (see run_sloppy_demo.sh). Your global
# config is untouched.
#
# Pipeline (everything on the DGX Spark via spark/reachy-mini.yaml in home-lab;
# no voice gateway needed):
#   mic → provider audio router (sleep/wake + wake-word gate, audio_router.py)
#       → voice /stt → Nemotron 3.5 ASR streaming (spark :8002, ws /v1/realtime)
#            → agent turn → Qwen3.6-35B-A3B-NVFP4 + MTP (spark :8000)
#            → voice /tts → Voxtral 4B TTS via vLLM-Omni (spark :8091)
#            → playback + runtime-driven head motion on the Reachy.
#
# NOTE: the Spark endpoints are non-localhost, so sloppy's voice network policy
# asks for one approval in the TUI when the conversation loop starts listening
# (createSpeechNetworkRule gates start_listening, then re-invokes preApproved).

# LLM: Qwen3.6 brain on the Spark. The server defaults to non-thinking
# (--default-chat-template-kwargs '{"enable_thinking": false}') and parses tool
# calls with qwen3_xml, so no thinking/compat handling is needed client-side.
# The codex profile is kept as a manual fallback.
llm:
  defaultProfileId: spark-brain
  endpoints:
    spark:
      label: Spark Qwen3.6 brain
      protocol: openai-chat
      baseUrl: http://192.168.1.103:8000/v1
      auth:
        type: none
      models:
        Qwen3.6-35B-A3B-NVFP4:
          label: Qwen3.6-35B-A3B NVFP4 (Spark)
          contextWindowTokens: 65536
          maxOutputTokens: 8192
          capabilities:
            tools: true
          compat:
            kind: openai
            thinkingFormat: none
    codex:
      label: OpenAI Codex
      protocol: openai-codex
      baseUrl: https://chatgpt.com/backend-api/codex
      auth:
        type: codex
      models:
        gpt-5.4-mini:
          label: Codex gpt-5.4-mini
          contextWindowTokens: 258400
          maxOutputTokens: 64000
          capabilities:
            tools: true
            images: true
          compat:
            kind: openai
            maxTokensField: max_completion_tokens
            thinkingFormat: openai
  profiles:
    - kind: native
      id: spark-brain
      label: Spark Qwen3.6 brain
      endpointId: spark
      model: Qwen3.6-35B-A3B-NVFP4
    - kind: native
      id: codex-mini
      label: Codex gpt-5.4-mini
      endpointId: codex
      model: gpt-5.4-mini

# Auto-discover the Reachy SLOP provider from its descriptor.
providers:
  discovery:
    enabled: true
    paths:
      - /tmp/slop/providers

plugins:
  # apps → the provider-management surface. The discovered `reachy` provider shows
  # up here; the agent loads it via apps' load_provider affordance (external
  # providers are not auto-connected). Once loaded, head-motion affordances are live.
  apps:
    enabled: true
  terminal:
    enabled: false
  filesystem:
    enabled: false

  # Voice provider: STT + TTS as SLOP affordances, both served by the Spark.
  voice:
    enabled: true
    stt:
      endpoints:
        # Nemotron 3.5 ASR streaming on the Spark (nemotron-asr-streaming-api):
        # server-side VAD, streaming partials, OpenAI GA transcription dialect.
        # 16 kHz PCM16 mono — the rate the FastConformer expects.
        nemotron-spark:
          protocol: realtime-stt
          dialect: openai
          baseUrl: ws://192.168.1.103:8002/v1/realtime
          auth:
            type: none
          sampleRate: 16000
          models:
            nvidia/nemotron-3.5-asr-streaming-0.6b: {}
      profiles:
        - id: stt-nemotron
          label: Nemotron 3.5 ASR (spark)
          endpointId: nemotron-spark
          model: nvidia/nemotron-3.5-asr-streaming-0.6b
      defaultProfileId: stt-nemotron
    tts:
      endpoints:
        # Voxtral TTS via vLLM-Omni on the Spark, direct (no gateway proxy).
        # Streams 24 kHz PCM from /v1/audio/speech.
        voxtral:
          protocol: openai-speech
          baseUrl: http://192.168.1.103:8091/v1
          auth:
            type: none
          model: mistralai/Voxtral-4B-TTS-2603
          pcmSampleRate: 24000
      profiles:
        - id: tts-voxtral
          label: Voxtral (spark)
          endpointId: voxtral
          model: mistralai/Voxtral-4B-TTS-2603
          voice: casual_female
      defaultProfileId: tts-voxtral

  # The hands-free conversation loop. Mic input comes from the provider's audio
  # router (gated by power_state/listen_mode — see audio_router.py): the
  # streamCommand bridges its Unix-socket PCM stream to stdout, and exits
  # non-zero on EOF so the continuous loop's restart backoff reconnects after a
  # provider restart. Playback stays on the host (sox `play`); on the Pi set
  # playStreamCommand: ["aplay", "-q", "-f", "S16_LE", "-r", "{rate}", "-c", "1"].
  # Path is relative to demo/ (run_sloppy_demo.sh cd's there).
  voice-conversation:
    enabled: true
    audio:
      backend: host
      streamCommand: ["python3", "../audio_stream_client.py", "--socket", "/tmp/slop/reachy_audio.sock", "--rate", "{rate}"]
      streamChunkMs: 40
      providerId: reachy
    embodiment:
      enabled: true
      providerId: reachy
    realtime:
      autoStartMode: continuous # hands-free from boot; Spark endpoints need one TUI approval
      defaultStartMode: continuous

session:
  persistSnapshots: true
  persistenceDir: .sloppy/sessions
